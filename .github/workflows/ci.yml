name: release-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMART_DATA_AGENT_TEST_MYSQL_URL: mysql+pymysql://sda_test:sda_test@127.0.0.1:3306/smart_data_agent_test
      SMART_DATA_AGENT_MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    services:
      mysql:
        image: mysql:8.0.18
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: smart_data_agent_test
          MYSQL_USER: sda_test
          MYSQL_PASSWORD: sda_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usda_test -psda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install uv==0.10.0
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ./scripts/release-gate.sh
      - run: ./scripts/build-image.sh ${{ github.sha }}

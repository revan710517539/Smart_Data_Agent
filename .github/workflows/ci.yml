name: release-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMART_DATA_AGENT_TEST_MYSQL_URL: mysql+pymysql://sda_test:sda_test@127.0.0.1:3306/smart_data_agent_test
      SMART_DATA_AGENT_MIGRATION_BASE_CANDIDATE: ${{ github.event.pull_request.base.sha || github.event.before }}
    services:
      mysql:
        image: mysql:8.0.18@sha256:e1b0fd480a11e5c37425a2591b6fbd32af886bfc6d6f404bd362be5e50a2e632
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: smart_data_agent_test
          MYSQL_USER: sda_test
          MYSQL_PASSWORD: sda_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usda_test -psda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve MySQL migration baseline
        id: migration-base
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(python3 scripts/resolve_mysql_migration_base.py \
            --candidate-ref "$SMART_DATA_AGENT_MIGRATION_BASE_CANDIDATE" \
            --head-ref "$GITHUB_SHA")"
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"
      - name: Verify release gates
        env:
          SMART_DATA_AGENT_MIGRATION_BASE_REF: ${{ steps.migration-base.outputs.base_ref }}
        run: SMART_DATA_AGENT_RELEASE_SCOPE=build SMART_DATA_AGENT_TARGET_PLATFORM=linux/amd64 ./scripts/release-gate.sh ${{ github.sha }}

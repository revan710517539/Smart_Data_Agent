name: release-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMART_DATA_AGENT_TEST_MYSQL_URL: mysql+pymysql://sda_test:sda_test@127.0.0.1:3306/smart_data_agent_test
    services:
      mysql:
        image: mysql:8.0.18
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: smart_data_agent_test
          MYSQL_USER: sda_test
          MYSQL_PASSWORD: sda_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usda_test -psda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: npm run typecheck
      - run: python scripts/check_frontend_module_size.py
      - run: python scripts/check_server_deployment_contract.py
      - run: python scripts/generate_api_client.py --check
      - run: npm run build
      - run: python -m unittest discover backend -p 'test_*.py' -v
      - run: node scripts/frontend-permission-smoke.mjs
      - run: python scripts/generate_database_schema.py --check
      - run: python scripts/check_mysql_sql_closure.py
      - run: python -m pip_audit -r requirements.lock
      - run: docker build -t smart-data-agent:${{ github.sha }} .

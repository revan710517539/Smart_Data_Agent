services:
  smart-data-agent:
    build:
      context: .
    ports:
      - "8787:8787"
    environment:
      SMART_DATA_AGENT_ENV: development
      SMART_DATA_AGENT_AUTH_MODE: development
      SMART_DATA_AGENT_AUTH_SECRET: "${SMART_DATA_AGENT_AUTH_SECRET:?set SMART_DATA_AGENT_AUTH_SECRET}"
      SMART_DATA_AGENT_DEVELOPMENT_LOGIN_PASSWORD: "${SMART_DATA_AGENT_DEVELOPMENT_LOGIN_PASSWORD:?set SMART_DATA_AGENT_DEVELOPMENT_LOGIN_PASSWORD}"
      SMART_DATA_AGENT_CORS_ORIGINS: "${SMART_DATA_AGENT_CORS_ORIGINS:-http://localhost:8787}"
      SMART_DATA_AGENT_DATABASE_URL: "${SMART_DATA_AGENT_DATABASE_URL:?set SMART_DATA_AGENT_DATABASE_URL to MySQL}"
      SMART_DATA_AGENT_DATA_WAREHOUSE: csv
      SMART_DATA_AGENT_OBJECT_STORE: local
      SMART_DATA_AGENT_OBJECT_ROOT: /app/runtime/artifacts
      SMART_DATA_AGENT_NON_STRUCTURED_ROOT: /app/runtime/non_structured
      SMART_DATA_AGENT_STATIC_ROOT: /app/dist
      SMART_DATA_AGENT_DATA_CRAWLER_ROOT: /app/data
      SMART_DATA_AGENT_EMBEDDED_WORKER: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - smart-data-agent-runtime:/app/runtime
      - ${SMART_DATA_AGENT_DATA_CRAWLER_HOST_ROOT:?set SMART_DATA_AGENT_DATA_CRAWLER_HOST_ROOT}:/app/data:ro
      - ${SMART_DATA_AGENT_TOPIC_DATA_HOST_ROOT:-./Topic_Data}:/app/Topic_Data
    restart: unless-stopped

volumes:
  smart-data-agent-runtime:
